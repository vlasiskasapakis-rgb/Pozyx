<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pozyx AR Viewer</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
<style>
  :root {
    --accent: #5dcaa5; --accent-dark: #0f6e56; --look: #f0a868; --danger: #f09595;
    --glass: rgba(20, 20, 18, .62); --text: #f4f3ef; --muted: #c9c8c1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #ar { position: fixed; inset: 0; overflow: hidden; }
  .ui { position: fixed; inset: 0; z-index: 11; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  .ui > * { pointer-events: auto; }
  .top { display: flex; flex-direction: column; gap: 6px; }
  .bar { display: flex; gap: 8px; }
  select, button { font: inherit; font-size: 15px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .25); background: var(--glass); color: var(--text); padding: 9px 12px; backdrop-filter: blur(6px); }
  select { flex: 1; min-width: 0; }
  .seg { display: flex; border: 1px solid rgba(255, 255, 255, .25); border-radius: 10px; overflow: hidden; background: var(--glass); backdrop-filter: blur(6px); }
  .seg button { flex: 1; border: 0; border-radius: 0; background: none; backdrop-filter: none; padding: 9px 10px; }
  .seg button + button { border-left: 1px solid rgba(255, 255, 255, .25); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #04342c; font-weight: 600; }
  .status { font-size: 12px; color: var(--muted); background: var(--glass); border-radius: 8px; padding: 5px 9px; align-self: flex-start; max-width: 100%; }
  .status.ok::before, .status.wait::before { content: "● "; }
  .status.ok::before { color: var(--accent); }
  .status.wait::before { color: var(--look); }
  .status.bad { color: var(--danger); }
  .cross { position: fixed; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .85); box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); transition: border-color .15s, transform .15s; }
  .cross::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; }
  .cross.on { border-color: var(--look); transform: scale(1.15); }
  .cross.on::after { background: var(--look); }
  .bottom { display: flex; flex-direction: column; gap: 8px; }
  .looknow { background: var(--glass); border-radius: 12px; padding: 10px 14px; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .looknow.on { background: var(--look); color: #2a1606; }
  .distnow { background: var(--glass); border-radius: 12px; padding: 8px 14px; font-size: 15px; font-variant-numeric: tabular-nums; cursor: pointer; }
  .distnow b { font-size: 20px; }
  .distnow small { display: block; opacity: .75; font-size: 12px; margin-top: 2px; }
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  ol li { background: var(--glass); border-radius: 8px; padding: 5px 10px; font-size: 13px; display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
  ol li .d { color: var(--muted); }
  .player { background: var(--glass); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(6px); }
  .player .ptitle { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .prow { display: flex; align-items: center; gap: 8px; }
  .player button { padding: 8px 12px; min-width: 64px; }
  .player input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .player .ptime { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: #151513; z-index: 10; }
  .start h1 { margin: 0; font-size: 22px; }
  .start p { margin: 0; color: var(--muted); max-width: 34ch; line-height: 1.45; }
  .start button { background: var(--accent-dark); border-color: var(--accent-dark); font-size: 17px; padding: 14px 28px; }
  .start .err { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="ar"></div>

<div class="ui">
  <div class="top">
    <div class="bar">
      <select id="session" aria-label="Session"></select>
      <button id="btnRefresh" title="Load sessions created on the laptop">Refresh</button>
    </div>
    <div class="seg" role="group" aria-label="Content">
      <button data-mode="generic" aria-pressed="true">Generic</button>
      <button data-mode="ai" aria-pressed="false">AI assisted</button>
    </div>
    <div id="status" class="status">Starting…</div>
  </div>
  <div class="bottom" id="bottom" hidden>
    <div id="player" class="player" hidden>
      <div id="pTitle" class="ptitle"></div>
      <div class="prow">
        <button id="pPlay">Pause</button>
        <button id="pStop">Stop</button>
        <input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="Position">
        <span id="pTime" class="ptime">0:00 / 0:00</span>
      </div>
    </div>
    <div id="distNow" class="distnow" hidden title="Tap to calibrate with a measured distance"></div>
    <div id="lookNow" class="looknow">Point the circle at an image</div>
    <ol id="recent"></ol>
  </div>
</div>
<div id="cross" class="cross" hidden></div>

<div id="startScreen" class="start">
  <h1>AR viewer</h1>
  <p id="startInfo">Loading images…</p>
  <button id="btnStart" disabled>Start camera</button>
  <p id="clockInfo" style="font-size:13px"></p>
</div>

<script src="pozyx_db.js"></script>
<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
import { addLights, buildTargetGroup, mixersIn, centreIsOn, mediaIn } from './ar_scene.js';

const $ = (id) => document.getElementById(id);
const db = window.pozyxDb;
const KEY = 'arviewer.v1';
const MIN_LOOK_MS = 300;   // shorter glances are not saved
const GRACE_MS = 400;      // a look survives the image being lost for this long (tracking flicker)

// Tracking settings (MindAR). Defaults: maxTrack 1 here (MindAR 1), filterMinCF 0.001,
// filterBeta 1000, warmupTolerance 5, missTolerance 5.
const TRACKING = {
  maxTrack: 1,            // posters tracked at once; 1 is the smoothest
  filterMinCF: 0.01,      // smoothing when still: higher = follows faster but shakes more (MindAR 0.001)
  filterBeta: 5000,       // smoothing when moving: higher = less trailing behind (MindAR 1000)
  warmupTolerance: 3,     // tracked frames before content appears (MindAR 5)
  missTolerance: 2,       // missed frames before content disappears; lower = hides sooner (MindAR 5)
};
// Drawing resolution: MindAR draws at the screen's full pixel density (often 3x on phones), which
// competes with image recognition on the graphics chip. 1.5x looks almost the same and tracks faster.
const MAX_PIXEL_RATIO = 1.5;
// Gliding: MindAR updates a poster's position ~10-15 times a second, the screen 60 times. Content
// glides toward each new position instead of jumping. Seconds to cover most of the way
// (higher = smoother but trails more; 0 = no gliding).
const GLIDE_S = 0.07;

let published = null, targetsById = new Map(), overlaysBy = new Map();
let dbSessions = [], current = '', outbox = [], recent = [], clockFix = null;
let mode = 'generic';                       // which content visitors see: 'generic' or 'ai' (AI assisted)
const MODES = { generic: 'Generic', ai: 'AI assisted' };
const modeGroups = [];                      // {mode, group} for every image, to show one mode at a time
let sending = false, retrying = false, retryTimer = null, problem = '';

const hasDb = () => !!(db && db.configured());
const now = () => Date.now() + (clockFix ? Math.round(clockFix.offset) : 0);   // server clock
const newId = () => { try { return crypto.randomUUID(); } catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2, 12); } };
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const pad = (n, w = 2) => String(n).padStart(w, '0');
function hms(ms) { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }

/* ---------- copy on this phone ---------- */
function loadLocal() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!s) return;
    dbSessions = s.dbSessions || [];
    current = typeof s.current === 'string' ? s.current : '';
    outbox = s.outbox || [];
    recent = s.recent || [];
    if (s.clockFix && Number.isFinite(s.clockFix.offset)) clockFix = s.clockFix;
    if (s.mode === 'ai' || s.mode === 'generic') mode = s.mode;
  } catch (e) {}
}
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify({ dbSessions, current, outbox, recent: recent.slice(0, 20), clockFix, mode })); } catch (e) {}
}

/* ---------- sessions (created in the Pozyx live map) ---------- */
function nameOf(id) { const x = dbSessions.find(q => q.id === id); return x ? x.name : id; }
async function loadSessions(manual) {
  if (!hasDb()) return;
  try {
    const before = new Set(dbSessions.map(x => x.id));
    dbSessions = await db.request('sessions?select=id,name,created_at_unix_ms&order=created_at_unix_ms.desc&limit=100');
    const fresh = dbSessions.find(x => !before.has(x.id)) || (!current && dbSessions[0]);
    if (manual && fresh) current = fresh.id;
    if (current && !dbSessions.some(x => x.id === current)) current = '';
    saveLocal();
    renderSessions();
    if (manual) flashStatus(`Looks go to "${current ? nameOf(current) : 'No session'}".`);
  } catch (e) {
    if (manual) flashStatus(`Could not load sessions: ${e.message}`);
  }
}
function renderSessions() {
  let h = '';
  for (const x of dbSessions) h += `<option value="${esc(x.id)}">${esc(x.name)}</option>`;
  h += '<option value="">No session</option>';
  $('session').innerHTML = h;
  $('session').value = current;
}

/* ---------- shared clock ---------- */
async function syncClock() {
  if (!hasDb()) return;
  try {
    clockFix = await db.measureClock();
    saveLocal();
    const o = clockFix.offset / 1000;
    $('clockInfo').textContent = `Synced to the server clock: this phone is ${Math.abs(o).toFixed(3)} s ${o > 0 ? 'behind' : 'ahead'}, corrected.`;
  } catch (e) {
    $('clockInfo').textContent = /server_time_ms/.test(e.message)
      ? 'Clock sync is off: run the updated supabase/schema.sql in Supabase.' : `Clock sync failed (${e.message}).`;
  }
}

/* ---------- saving looks ---------- */
async function send() {
  if (sending || !hasDb() || !outbox.length) { renderStatus(); return; }
  sending = true;
  renderStatus();
  while (outbox.length) {
    const rows = outbox.slice(0, 50);
    try {
      await db.upsert('looks', rows, 'id', { keepalive: true });
      outbox.splice(0, rows.length);
      retrying = false;
      problem = '';
      saveLocal();
    } catch (e) {
      retrying = true;
      problem = e.message || String(e);
      clearTimeout(retryTimer);
      retryTimer = setTimeout(send, 4000 + Math.random() * 3000);
      break;
    }
  }
  sending = false;
  renderStatus();
}
let statusMsg = '', statusTimer = null;
function flashStatus(text) {
  statusMsg = text;
  renderStatus();
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { statusMsg = ''; renderStatus(); }, 4000);
}
function renderStatus() {
  const el = $('status');
  let text, cls = '';
  if (statusMsg) text = statusMsg;
  else if (!hasDb()) text = 'No database set in pozyx_db.js.';
  else if (outbox.length) {
    text = retrying ? `${outbox.length} look${outbox.length === 1 ? '' : 's'} not uploaded yet (${problem}). Retrying…` : 'Uploading…';
    cls = 'wait';
  } else { text = `Saving looks to "${current ? nameOf(current) : 'No session'}"`; cls = 'ok'; }
  el.textContent = text;
  el.className = 'status ' + cls;
}

/* ---------- looks ---------- */
let look = null;   // {idx, start, last}
function updateLook(idx) {
  const t = now();
  if (look && idx === look.idx) { look.last = t; return; }
  if (look && idx !== null) { finishLook(look, t); look = null; }            // moved straight to another image
  else if (look && t - look.last > GRACE_MS) { finishLook(look, look.last); look = null; }
  if (!look && idx !== null) look = { idx, start: t, last: t, mode };
}
function finishLook(l, end) {
  if (end - l.start < MIN_LOOK_MS) return;
  const target = targetsById.get(published.target_ids[l.idx]);
  const row = {
    id: newId(), session_id: current || null, session_name: current ? nameOf(current) : null,
    target_id: target.id, target_name: target.name, mode: l.mode, start_unix_ms: Math.round(l.start), end_unix_ms: Math.round(end),
    clock_offset_ms: clockFix ? Math.round(clockFix.offset) : null,
  };
  recent.unshift({ name: target.name, mode: l.mode, start: row.start_unix_ms, ms: row.end_unix_ms - row.start_unix_ms });
  recent = recent.slice(0, 20);
  if (hasDb()) outbox.push(row);
  saveLocal();
  renderRecent();
  send();
}
function renderRecent() {
  $('recent').innerHTML = recent.slice(0, 4).map(r =>
    `<li><span>${esc(r.name)}${r.mode === 'ai' ? ' · AI' : ''}</span><span class="d">${hms(r.start)} · ${(r.ms / 1000).toFixed(1)} s</span></li>`).join('');
}

/* ---------- live view for the laptop ---------- */
// The live map shows what this phone is pointing at right now (table ar_live, one row per phone).
const DEVICE = (() => {
  try { let d = localStorage.getItem('arviewer.device'); if (!d) { d = newId(); localStorage.setItem('arviewer.device', d); } return d; }
  catch (e) { return newId(); }
})();
let liveKey = '', liveAt = 0;
let livePose = null, liveHasPose = true;   // false when the database has no heading columns yet
function reportLive(force) {
  if (!hasDb() || !published) return;
  const target = look ? targetsById.get(published.target_ids[look.idx]) : null;
  const key = `${target ? target.id : ''}|${mode}|${current}`;
  const t = now();
  // also when the phone turned (at most twice a second), so the live map can follow
  const turned = pose && (!livePose || angleDiff(pose.heading, livePose.heading) > 8 || Math.abs(pose.pitch - livePose.pitch) > 8);
  if (!force && key === liveKey && !(turned && t - liveAt > 400) && t - liveAt < 5000) return;   // on every change, and every 5 s
  liveKey = key;
  liveAt = t;
  livePose = pose ? { ...pose } : null;
  const row = {
    device_id: DEVICE, session_id: current || null, session_name: current ? nameOf(current) : null,
    target_id: target ? target.id : null, target_name: target ? target.name : null, mode,
    since_unix_ms: look ? Math.round(look.start) : null, updated_at_unix_ms: Math.round(t),
  };
  if (liveHasPose) { row.heading = pose ? pose.heading : null; row.pitch = pose ? pose.pitch : null; }
  db.upsert('ar_live', [row], 'device_id', { keepalive: true }).catch((e) => {
    if (liveHasPose && /heading|pitch/.test(e.message)) { liveHasPose = false; liveKey = ''; }   // older database: send without them
  });
}

/* ---------- phone orientation ---------- */
// Where the back camera points, from the phone's own orientation sensors (compass-based), saved
// about 5 times a second on the server clock (table phone_pose) so the live map and replays can show it.
// heading: compass bearing 0-360 (0 = north, 90 = east); pitch: up + / down -; roll: sideways tilt.
let pose = null, poseSource = '', poseHasTable = true, sendingPose = false, poseAt = 0;
const poseQueue = [];
const angleDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
function cameraPose(alpha, beta, gamma) {
  const r = Math.PI / 180;
  const ca = Math.cos(alpha * r), sa = Math.sin(alpha * r), cb = Math.cos(beta * r), sb = Math.sin(beta * r), cg = Math.cos(gamma * r), sg = Math.sin(gamma * r);
  // rotation Rz(alpha) Rx(beta) Ry(gamma) applied to the camera direction (0, 0, -1) and the right edge (1, 0, 0);
  // the result is in (east, north, up)
  const dx = -sg * ca - cg * sb * sa, dy = -sg * sa + cg * sb * ca, dz = -cg * cb;
  const rz = -sg * cb;
  const deg = (v) => v / r, clamp = (v) => Math.max(-1, Math.min(1, v));
  return {
    heading: Math.round(((deg(Math.atan2(dx, dy)) + 360) % 360) * 10) / 10,
    pitch: Math.round(deg(Math.asin(clamp(dz))) * 10) / 10,
    roll: Math.round(deg(Math.asin(clamp(rz))) * 10) / 10,
  };
}
function onOrientation(e, absolute) {
  if (e.alpha == null || e.beta == null || e.gamma == null) return;
  let alpha = e.alpha;
  if (absolute) poseSource = 'compass';
  else if (typeof e.webkitCompassHeading === 'number') { alpha = 360 - e.webkitCompassHeading; poseSource = 'compass'; }   // iPhone
  else if (poseSource !== 'compass') poseSource = 'relative';   // no compass: north is not known
  pose = cameraPose(alpha, e.beta, e.gamma);
}
// Must be called straight from a tap (iPhones ask for permission)
function startOrientation() {
  const ask = window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'
    ? DeviceOrientationEvent.requestPermission().catch(() => 'denied') : Promise.resolve('granted');
  ask.then((state) => {
    if (state !== 'granted') { flashStatus('Motion sensors not allowed: the live map will not know where the phone points.'); return; }
    if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', (e) => onOrientation(e, true));
    else window.addEventListener('deviceorientation', (e) => onOrientation(e, false));
    setTimeout(() => {
      if (!pose) flashStatus('This phone gives no orientation readings: the live map will not know where it points.');
      else if (poseSource === 'relative') flashStatus('No compass on this phone: directions are not related to north.');
    }, 2500);
  });
}
function samplePose() {
  const t = now();
  if (!pose || !hasDb() || !poseHasTable || t - poseAt < 200) return;   // about 5 a second
  poseAt = t;
  poseQueue.push({ id: newId(), device_id: DEVICE, session_id: current || null, unix_ms: Math.round(t), ...pose });
  if (poseQueue.length > 6000) poseQueue.splice(0, poseQueue.length - 6000);   // offline for long: keep the last 20 minutes
}
async function sendPose() {
  if (sendingPose || !poseQueue.length || !poseHasTable) return;
  sendingPose = true;
  const batch = poseQueue.splice(0, 500);
  try {
    await db.upsert('phone_pose', batch, 'id', { keepalive: batch.length <= 150 });
  } catch (e) {
    if (/phone_pose/.test(e.message)) { poseHasTable = false; poseQueue.length = 0; flashStatus('Run the updated supabase/schema.sql to save the phone direction.'); }
    else poseQueue.unshift(...batch);   // offline: try again later
  }
  sendingPose = false;
}
setInterval(sendPose, 2000);

/* ---------- audio and video ---------- */
// Tapping an audio or video item plays it; the player bar controls the one playing.
const media = [];          // {el, ov, hit, object} for every audio and video item
let activeMedia = null, arCamera = null, seeking = false;
const raycaster = new THREE.Raycaster();

function shown(obj) {      // visible on screen: its poster is tracked and its mode is chosen
  for (let o = obj; o; o = o.parent) if (!o.visible) return false;
  return true;
}
function onTap(e) {
  if (!arCamera) return;
  const r = $('ar').getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, arCamera);
  const items = media.filter(m => shown(m.object));
  const hits = raycaster.intersectObjects(items.flatMap(m => m.hit), false);
  if (!hits.length) return;
  const item = items.find(m => m.hit.includes(hits[0].object));
  if (item.el.paused) {
    for (const m of media) if (m !== item) m.el.pause();   // one at a time
    item.el.play().catch(err => flashStatus(`Could not play: ${err.message}`));
  } else {
    item.el.pause();
  }
  activeMedia = item;
  renderPlayer();
}
function stopAll() {
  for (const m of media) m.el.pause();
}
const fmt = (sec) => Number.isFinite(sec) ? `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}` : '0:00';
function renderPlayer() {
  const m = activeMedia;
  $('player').hidden = !m;
  if (!m) return;
  $('pTitle').textContent = (m.ov.kind === 'video' ? 'Video · ' : 'Audio · ') + (m.ov.text || m.ov.asset_name || '');
  $('pPlay').textContent = m.el.paused ? 'Play' : 'Pause';
  const d = m.el.duration;
  if (!seeking) $('pSeek').value = Number.isFinite(d) && d > 0 ? Math.round(m.el.currentTime / d * 1000) : 0;
  $('pTime').textContent = `${fmt(m.el.currentTime)} / ${fmt(d)}`;
}

/* ---------- gliding ---------- */
const gPos = new THREE.Vector3(), gRot = new THREE.Quaternion(), gScale = new THREE.Vector3();
let arAnchors = [];
function glide(dt) {
  const k = GLIDE_S > 0 ? 1 - Math.exp(-dt / GLIDE_S) : 1;   // the same feel at any frame rate
  for (const a of arAnchors) {
    if (!a) continue;
    if (!a.anchor.group.visible) { a.follower.visible = false; a.placed = false; continue; }
    a.anchor.group.matrixWorld.decompose(gPos, gRot, gScale);
    if (!a.placed) {   // just found: appear in place, no sliding in from the last spot
      a.follower.position.copy(gPos);
      a.follower.quaternion.copy(gRot);
      a.follower.scale.copy(gScale);
      a.placed = true;
    } else {
      a.follower.position.lerp(gPos, k);
      a.follower.quaternion.slerp(gRot, k);
      a.follower.scale.lerp(gScale, k);
    }
    a.follower.visible = true;
  }
}

/* ---------- distance to the painting (shown only, not saved) ----------
   MindAR places each image 1 "image width" wide, so the distance from the camera to the image's
   centre in image widths is |position| / scale of its anchor; times the painting's real width
   (Painting sizes in the AR editor) gives meters. The angle is between the painting's facing
   direction and the line to the phone (0° = straight on). */
let dist = null;   // { idx, widths, angle } smoothed
let distScale = (() => { try { return +localStorage.getItem('arviewer.distScale') || 1; } catch (e) { return 1; } })();
const dPos = new THREE.Vector3(), dRot = new THREE.Quaternion(), dScl = new THREE.Vector3(), dN = new THREE.Vector3();
function measureDistance(idx, dt) {
  const a = idx === null ? null : arAnchors[idx];
  if (!a || !a.anchor.group.visible) { dist = null; return; }
  a.anchor.group.matrixWorld.decompose(dPos, dRot, dScl);
  if (!(dScl.x > 0)) return;
  const widths = dPos.length() / dScl.x;
  dN.set(0, 0, 1).applyQuaternion(dRot);
  const angle = Math.acos(Math.max(-1, Math.min(1, dN.dot(dPos.clone().negate().normalize())))) * 180 / Math.PI;
  const k = 1 - Math.exp(-dt / 0.4);   // about half a second of averaging: steadier numbers
  if (!dist || dist.idx !== idx) dist = { idx, widths, angle };
  else { dist.widths += (widths - dist.widths) * k; dist.angle += (angle - dist.angle) * k; }
}
function renderDistance() {
  const el = $('distNow');
  if (!dist) { el.hidden = true; return; }
  const t = targetsById.get(published.target_ids[dist.idx]);
  const w = t && +t.width_m;
  const side = dist.angle < 10 ? 'straight on' : `${Math.round(dist.angle)}° to the side`;
  el.hidden = false;
  el.innerHTML = w
    ? `<b>${(dist.widths * w * distScale).toFixed(2)} m</b> from ${esc(t.name)} · ${side}<small>painting ${Math.round(w * 100)} cm wide${distScale !== 1 ? ` · calibrated ×${distScale.toFixed(2)}` : ''} · test only, not saved</small>`
    : `<b>${dist.widths.toFixed(1)}</b> painting widths from ${esc(t ? t.name : 'image')} · ${side}<small>Add its size in the AR editor (Painting sizes) to see meters</small>`;
}
// One-time correction for this phone's camera: stand at a measured distance and enter it
$('distNow').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!dist) return;
  const t = targetsById.get(published.target_ids[dist.idx]), w = t && +t.width_m;
  if (!w) return;
  const shown = dist.widths * w;
  const v = prompt(`Calibrate this phone: measure the real distance from the phone to the painting with a tape and enter it in meters.\n(Now showing ${(shown * distScale).toFixed(2)} m. Enter 0 to undo the calibration.)`, '');
  if (v === null) return;
  const real = parseFloat(String(v).replace(',', '.'));
  if (real === 0) distScale = 1;
  else if (Number.isFinite(real) && real > 0.1 && real < 20) distScale = real / shown;
  else return;
  try { localStorage.setItem('arviewer.distScale', String(distScale)); } catch (err) {}
  renderDistance();
});

/* ---------- content mode ---------- */
function setMode(m) {
  if (look && m !== mode) { finishLook(look, now()); look = null; }   // a look belongs to one mode
  mode = m;
  stopAll();   // the other mode's audio and video are hidden now
  for (const x of modeGroups) x.group.visible = x.mode === mode;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  saveLocal();
}

/* ---------- AR ---------- */
async function loadContent() {
  if (!hasDb()) { $('startInfo').textContent = 'No database set in pozyx_db.js.'; return; }
  try {
    published = (await db.request('ar_published?select=*&id=eq.current'))[0] || null;
    if (!published) { $('startInfo').textContent = 'Nothing published yet. In the AR editor, upload images and click "Publish to phone".'; return; }
    const targets = await db.request('ar_targets?select=*');
    targetsById = new Map(targets.map(t => [t.id, t]));
    for (const o of await db.request('ar_overlays?select=*')) {
      if (!overlaysBy.has(o.target_id)) overlaysBy.set(o.target_id, []);
      overlaysBy.get(o.target_id).push(o);
    }
  } catch (e) {
    $('startInfo').textContent = `Could not load the AR content: ${e.message}`;
    $('startInfo').className = 'err';
    return;
  }
  const n = published.target_ids.filter(id => targetsById.has(id)).length;
  $('startInfo').textContent = `${n} image${n === 1 ? '' : 's'} ready. Pick the session at the top, start the camera, then point the circle at an image.`;
  $('btnStart').disabled = false;
}

async function startAR() {
  startOrientation();   // first, while this still counts as the tap
  $('btnStart').disabled = true;
  $('startInfo').textContent = 'Starting the camera…';
  try {
    const mind = new MindARThree({
      container: $('ar'), imageTargetSrc: db.fileUrl(published.mind_path), ...TRACKING,
      uiLoading: 'no', uiScanning: 'no', uiError: 'no',
    });
    const { renderer, scene, camera } = mind;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO));
    addLights(scene);
    const found = new Set(), anchors = [];
    let mixers = [];
    for (let i = 0; i < published.target_ids.length; i++) {
      const target = targetsById.get(published.target_ids[i]);
      if (!target) continue;   // deleted after publishing
      const anchor = mind.addAnchor(i);
      // the content sits in its own group that glides after MindAR's anchor (see glide())
      const follower = new THREE.Group();
      follower.visible = false;
      scene.add(follower);
      anchors[i] = { anchor, target, follower, placed: false };
      for (const m of Object.keys(MODES)) {   // both sets of content; only the chosen mode is visible
        const items = (overlaysBy.get(target.id) || []).filter(o => (o.mode || 'generic') === m);
        buildTargetGroup(target, items, (p) => db.fileUrl(p)).then(g => {
          g.visible = m === mode;
          modeGroups.push({ mode: m, group: g });
          follower.add(g);
          mixers = mixers.concat(mixersIn(g));
          media.push(...mediaIn(g));
        });
      }
      anchor.onTargetFound = () => found.add(i);
      anchor.onTargetLost = () => found.delete(i);
    }
    arAnchors = anchors;
    await mind.start();
    arCamera = camera;
    $('ar').addEventListener('click', onTap);
    $('startScreen').hidden = true;
    $('cross').hidden = false;
    $('bottom').hidden = false;
    keepAwake();
    const clock = new THREE.Clock();
    let uiAt = 0;
    renderer.setAnimationLoop(() => {
      if (document.visibilityState === 'hidden') return;   // page in the background: no looks
      const dt = clock.getDelta();
      for (const m of mixers) m.update(dt);
      scene.updateMatrixWorld();
      glide(dt);
      let pointed = null;
      for (const i of found) if (centreIsOn(anchors[i].target, anchors[i].anchor.group, camera)) { pointed = i; break; }
      updateLook(pointed);
      measureDistance(pointed !== null ? pointed : (found.size ? [...found][0] : null), dt);
      samplePose();
      reportLive();
      renderer.render(scene, camera);
      const t = performance.now();
      if (t - uiAt > 100) { uiAt = t; renderLookNow(); renderPlayer(); renderDistance(); }
    });
    window.__ar = { mind, found, anchors, media, get dist() { return dist; }, get look() { return look; }, get pose() { return pose; }, poseQueue, cameraPose };   // for testing
  } catch (e) {
    $('startInfo').textContent = `Could not start the camera: ${e.message || e}. Allow camera access for this page and try again.`;
    $('startInfo').className = 'err';
    $('btnStart').disabled = false;
  }
}
function renderLookNow() {
  const el = $('lookNow');
  const on = !!look;
  $('cross').classList.toggle('on', on);
  el.classList.toggle('on', on);
  el.textContent = on
    ? `Looking at ${targetsById.get(published.target_ids[look.idx]).name} · ${((now() - look.start) / 1000).toFixed(1)} s`
    : 'Point the circle at an image';
}

let wake = null;
async function keepAwake() {
  try {
    if (!wake && document.visibilityState === 'visible' && navigator.wakeLock) {
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });
    }
  } catch (e) {}
}

/* ---------- wiring ---------- */
$('btnStart').onclick = startAR;
$('pPlay').onclick = () => {
  const m = activeMedia;
  if (!m) return;
  if (m.el.paused) { stopAll(); m.el.play().catch(err => flashStatus(`Could not play: ${err.message}`)); } else m.el.pause();
  renderPlayer();
};
$('pStop').onclick = () => {
  if (!activeMedia) return;
  activeMedia.el.pause();
  activeMedia.el.currentTime = 0;
  activeMedia = null;
  renderPlayer();
};
$('pSeek').addEventListener('input', () => {
  seeking = true;
  const m = activeMedia;
  if (m && Number.isFinite(m.el.duration)) m.el.currentTime = $('pSeek').value / 1000 * m.el.duration;
});
$('pSeek').addEventListener('change', () => { seeking = false; });
document.querySelector('.seg').onclick = (e) => { const b = e.target.closest('button[data-mode]'); if (b) setMode(b.dataset.mode); };
$('btnRefresh').onclick = () => loadSessions(true);
$('session').onchange = () => { current = $('session').value; saveLocal(); renderStatus(); };
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { stopAll(); if (look) { finishLook(look, look.last); look = null; } reportLive(true); send(); }
  else { keepAwake(); send(); loadSessions(); syncClock(); }
});
window.addEventListener('online', send);
window.addEventListener('pagehide', send);
window.addEventListener('pagehide', sendPose);

loadLocal();
setMode(mode);
renderSessions();
renderRecent();
renderStatus();
loadSessions();
syncClock();
setInterval(syncClock, 5 * 60 * 1000);
send();
loadContent();
</script>
</body>
</html>
